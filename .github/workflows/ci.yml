name: CI

on:
  # Any pushed branch (except main) runs the tests.
  push:
    branches-ignore: [main]
  # A newly opened PR gets a Claude review. Add `synchronize` to the types
  # to re-review on every new commit.
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka_cluster_namer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10" # lowest version the package supports
          cache: pip
          cache-dependency-path: kafka_cluster_namer/pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed to post the review
    env:
      # Subscription token, created locally with `claude setup-token`
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }} # read by the `gh` CLI in post_review.py
      BASE_REF: origin/${{ github.base_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Check out the PR head itself, not the default synthetic merge commit,
      # so that the reviewed code, the diff and the review's commit_id match.
      # Full history is needed for the three-dot diff against the base branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Same command as scripts/claude_review.sh runs internally, so the diff
      # used to map findings to lines is the one Claude reviewed.
      - name: Write the PR diff
        run: git diff "${BASE_REF}...HEAD" > pr.diff

      # TEMPORARY: show the token's shape (not its value) to debug the 401.
      - name: Check the auth token
        run: |
          echo "length: ${#CLAUDE_CODE_OAUTH_TOKEN}"
          echo "prefix: $(printf %s "$CLAUDE_CODE_OAUTH_TOKEN" | head -c 11)"
          echo "contains whitespace: $(printf %s "$CLAUDE_CODE_OAUTH_TOKEN" | grep -c '[[:space:]]' || true)"
          echo "ANTHROPIC_API_KEY set: ${ANTHROPIC_API_KEY:+yes}"
          echo "ANTHROPIC_AUTH_TOKEN set: ${ANTHROPIC_AUTH_TOKEN:+yes}"
          claude --version
          claude -p "say hi" --max-turns 1 || true

      - name: Review the PR with Claude
        run: |
          # A secret pasted with a trailing newline or space still shows as ***
          # in the logs but is rejected with a 401, so strip whitespace.
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf %s "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          scripts/claude_review.sh > review.json

      # The script prints nothing when the PR has no changes.
      - name: Post the review
        run: |
          if [ -s review.json ]; then
            uv run --with pydantic python post_review.py \
              --repo "$GITHUB_REPOSITORY" \
              --pr "${{ github.event.pull_request.number }}" \
              --diff-file pr.diff \
              --commit-id "$HEAD_SHA" < review.json
          else
            echo "No review output; nothing to post."
          fi
